<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>MSME Report - Subtotals and Grand Totals</title>
  <style>
    table, th, td {
      border: 1px solid #000;
      border-collapse: collapse;
      text-align: center;
      padding: 5px;
    }
    th {
      background-color: #e0e0e0;
    }
    input {
      width: 60px;
      text-align: right;
    }
    .bold {
      font-weight: bold;
      background-color: #f7f7f7;
    }
    textarea {
      width: 100%;
      height: 80px;
    }
    .side-note {
      margin-top: 10px;
      font-size: 12px;
      font-weight: normal;
      line-height: 1.0;
    }    .tab-container {
      margin: 10px 0;
      background-color: #f1f1f1;
    }
    .tab-container ul {
      list-style: none;
      padding: 0;
      margin: 0;
      display: flex;
      border-bottom: 2px solid #ccc;
    }
    .tab-container li {
      padding: 10px 20px;
      cursor: pointer;
      background-color: #ddd;
    }
    .tab-container li:hover {
      background-color: #ccc;
    }
    .tab-container .active {
      background-color: #aaa;
      font-weight: bold;
    }
    .reset-button {
      margin-top: 10px;
      padding: 8px 12px;
      background-color: #cc0000;
      color: white;
      border: none;
      cursor: pointer;
    }
    .reset-button:hover {
      background-color: #a00000;
    }
  </style>
</head>
<body>

<h2>A. Clients Assisted</h2>
<h2>A.1. (Unique Count)</h2>

<div class="tab-container">
  <ul>
    <li><a href="A.1.html">A.1. (Unique Count)</a></li>
    <li><a href="A.2.1.html">A.2.1. Classification by Asset Size (MSME)</a></li>
  </ul>
</div>


<table id="reportTable">
  <thead>
    <tr>
      <th rowspan="3">Period</th>
      <th colspan="10">MSME Levels</th>
      <th colspan="2" rowspan="2">Potential MSMEs</th>
      <th colspan="3" rowspan="2">Total</th>
    </tr>
    <tr>
      <th colspan="2">Level 1.1</th>
      <th colspan="2">Level 1.2</th>
      <th colspan="2">Level 2</th>
      <th colspan="2">Level 3</th>
      <th colspan="2">Level 4</th>
    </tr>
    <tr>
      <th>M</th><th>F</th>
      <th>M</th><th>F</th>
      <th>M</th><th>F</th>
      <th>M</th><th>F</th>
      <th>M</th><th>F</th>
      <th>M</th><th>F</th>
      <th>M</th><th>F</th><th>M+F</th>
    </tr>
  </thead>
  <tbody id="tableBody"></tbody>
</table>

<div class="side-note">M - Male</div>
<div class="side-note">F - Female</div>

<script>
const months = [
  "January", "February", "March", "April", "May", "June",
  "July", "August", "September", "October", "November", "December"
];

const tableBody = document.getElementById("tableBody");

months.forEach((month, rowIdx) => {
  const row = document.createElement("tr");
  row.dataset.index = rowIdx;

  let html = `<td>${month}</td>`;
  for (let i = 0; i < 12; i++) {
    html += `<td><input type="number" min="0" value="0" oninput="calculate(${rowIdx}); saveData();"></td>`;
  }
  html += `
    <td class="bold" id="totalMale${rowIdx}">0</td>
    <td class="bold" id="totalFemale${rowIdx}">0</td>
    <td class="bold" id="totalMF${rowIdx}">0</td>
  `;
  row.innerHTML = html;
  tableBody.appendChild(row);
});

// Total row
const TotalRow = document.createElement("tr");
TotalRow.classList.add("bold");
TotalRow.id = "TotalRow";
let TotalHTML = `<td>Total</td>`;
for (let i = 0; i < 12; i++) {
  TotalHTML += `<td id="TotalCol${i}">0</td>`;
}
TotalHTML += `
  <td id="TotalMale">0</td>
  <td id="TotalFemale">0</td>
  <td id="TotalMF">0</td>
`;
TotalRow.innerHTML = TotalHTML;
tableBody.appendChild(TotalRow);

// Subtotal row
const subtotalRow = document.createElement("tr");
subtotalRow.classList.add("bold");
let subtotalHTML = `<td>Subtotal</td>`;
subtotalHTML += `<td colspan="2" id="subtotalLevel11">0</td>`;
subtotalHTML += `<td colspan="2" id="subtotalLevel12">0</td>`;
subtotalHTML += `<td colspan="2" id="subtotalLevel2">0</td>`;
subtotalHTML += `<td colspan="2" id="subtotalLevel3">0</td>`;
subtotalHTML += `<td colspan="2" id="subtotalLevel4">0</td>`;
subtotalHTML += `<td colspan="2" id="subtotalPotential">0</td>`;
subtotalHTML += `<td colspan="3" id="subtotalMF" rowspan="2">0</td>`;
subtotalRow.innerHTML = subtotalHTML;
tableBody.appendChild(subtotalRow);

// Grand Total row
const grandRow = document.createElement("tr");
grandRow.classList.add("bold");
let grandHTML = `<td>Grand Total</td>`;
grandHTML += `<td colspan="10" id="grandAllLevels">0</td>`;
grandHTML += `<td colspan="2" id="grandPotential">0</td>`;
grandRow.innerHTML = grandHTML;
tableBody.appendChild(grandRow);

// Notes row
const notesRow = document.createElement("tr");
let notesHTML = `<td colspan="16">
  <textarea id="notes" placeholder="Enter any notes here..."></textarea>
</td>`;
notesRow.innerHTML = notesHTML;
tableBody.appendChild(notesRow);

function calculate(rowIdx) {
  const row = document.querySelector(`tr[data-index="${rowIdx}"]`);
  const inputs = row.querySelectorAll("input");

  let maleTotal = 0;
  let femaleTotal = 0;

  inputs.forEach((input, i) => {
    const value = Number(input.value) || 0;
    if (i % 2 === 0) maleTotal += value;
    else femaleTotal += value;
  });

  document.getElementById(`totalMale${rowIdx}`).innerText = maleTotal;
  document.getElementById(`totalFemale${rowIdx}`).innerText = femaleTotal;
  document.getElementById(`totalMF${rowIdx}`).innerText = maleTotal + femaleTotal;

  calculateSubtotals();
}

function calculateSubtotals() {
  let colSums = Array(12).fill(0);
  let totalMale = 0;
  let totalFemale = 0;

  for (let rowIdx = 0; rowIdx < months.length; rowIdx++) {
    const inputs = document.querySelectorAll(`tr[data-index="${rowIdx}"] input`);
    inputs.forEach((input, i) => {
      colSums[i] += Number(input.value) || 0;
    });

    totalMale += Number(document.getElementById(`totalMale${rowIdx}`).innerText);
    totalFemale += Number(document.getElementById(`totalFemale${rowIdx}`).innerText);
  }

  for (let i = 0; i < 12; i++) {
    document.getElementById(`TotalCol${i}`).innerText = colSums[i];
  }

  document.getElementById("TotalMale").innerText = totalMale;
  document.getElementById("TotalFemale").innerText = totalFemale;
  document.getElementById("TotalMF").innerText = totalMale + totalFemale;

  document.getElementById("subtotalLevel11").innerText = colSums[0] + colSums[1];
  document.getElementById("subtotalLevel12").innerText = colSums[2] + colSums[3];
  document.getElementById("subtotalLevel2").innerText = colSums[4] + colSums[5];
  document.getElementById("subtotalLevel3").innerText = colSums[6] + colSums[7];
  document.getElementById("subtotalLevel4").innerText = colSums[8] + colSums[9];
  document.getElementById("subtotalPotential").innerText = colSums[10] + colSums[11];
  document.getElementById("subtotalMF").innerText = totalMale + totalFemale;

  const totalLevels = colSums.slice(0, 10).reduce((a, b) => a + b, 0);
  const totalPotential = colSums[10] + colSums[11];
  const overallTotal = totalLevels + totalPotential;

  document.getElementById("grandAllLevels").innerText = totalLevels;
  document.getElementById("grandPotential").innerText = totalPotential;
}

// Save data to localStorage
function saveData() {
  const data = [];
  document.querySelectorAll("#reportTable tbody tr").forEach((row) => {
    const inputs = row.querySelectorAll("input");
    const rowData = Array.from(inputs).map(input => input.value);
    data.push(rowData);
  });
  localStorage.setItem("reportData", JSON.stringify(data));

  const notes = document.getElementById("notes");
  if (notes) {
    localStorage.setItem("reportNotes", notes.value);
  }
}

// Load data from localStorage on page load
function loadData() {
  const savedData = JSON.parse(localStorage.getItem("reportData"));
  const notes = localStorage.getItem("reportNotes");

  if (savedData) {
    document.querySelectorAll("#reportTable tbody tr").forEach((row, rowIndex) => {
      const inputs = row.querySelectorAll("input");
      if (savedData[rowIndex]) {
        inputs.forEach((input, colIndex) => {
          input.value = savedData[rowIndex][colIndex] || 0;
        });
        if (row.dataset.index !== undefined) {
          calculate(parseInt(row.dataset.index));
        }
      }
    });
    calculateSubtotals();
  }

  if (notes !== null) {
    document.getElementById("notes").value = notes;
  }
}

// Auto-bind all inputs and textarea
window.addEventListener("DOMContentLoaded", () => {
  loadData();
  document.getElementById("notes").addEventListener("input", saveData);
});
</script>

</body>
</html>
