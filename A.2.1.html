<!DOCTYPE html> 
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>MSME Report (January to December)</title>
  <style>
    table, th, td {
      border: 1px solid #000;
      border-collapse: collapse;
      text-align: center;
      padding: 5px;
    }
    th {
      background-color: #e0e0e0;
    }
    input {
      width: 60px;
      text-align: right;
    }
    .bold {
      font-weight: bold;
      background-color: #f7f7f7;
    }
    textarea {
      width: 100%;
      height: 60px;
      resize: none;
    }
    .tab-container {
      margin: 10px 0;
      background-color: #f1f1f1;
    }
    .tab-container ul {
      list-style: none;
      padding: 0;
      margin: 0;
      display: flex;
      border-bottom: 2px solid #ccc;
    }
    .tab-container li {
      padding: 10px 20px;
      cursor: pointer;
      background-color: #ddd;
    }
    .tab-container li:hover {
      background-color: #ccc;
    }
    .tab-container .active {
      background-color: #aaa;
      font-weight: bold;
    }
    .reset-button {
      margin-top: 10px;
      padding: 8px 12px;
      background-color: #cc0000;
      color: white;
      border: none;
      cursor: pointer;
    }
    .reset-button:hover {
      background-color: #a00000;
    }
  </style>
</head>
<body>

<h2>A.2.1. Classification by Asset Size (MSME)</h2>

<div class="tab-container">
  <ul>
    <li><a href="A.1.html">A.1. (Unique Count)</a></li>
    <li><a href="A.2.1.html">A.2.1. Classification by Asset Size (MSME)</a></li>
  </ul>
</div>

<table id="reportTable">
  <thead>
    <tr>
      <th>Period</th>
      <th>Micro</th>
      <th>Small</th>
      <th>Medium</th>
      <th>Total</th>
    </tr>
  </thead>
  <tbody id="tableBody"></tbody>
  <tfoot>
    <tr class="bold">
      <td>Total</td>
      <td id="totalMicro">0</td>
      <td id="totalSmall">0</td>
      <td id="totalMedium">0</td>
      <td id="totalOverall">0</td>
    </tr>
    <tr>
      <td colspan="5">
        <textarea id="notes" placeholder="Enter any notes here..."></textarea>
      </td>
    </tr>
  </tfoot>
</table>

<!-- Reset Button -->
<button class="reset-button" onclick="resetData()">Reset All Data</button>

<script>
const periods = [
  "January", "February", "March", "April",
  "May", "June", "July", "August",
  "September", "October", "November", "December"
];

const tableBody = document.getElementById("tableBody");

// Load saved data
function loadData() {
  const savedData = JSON.parse(localStorage.getItem("msmeData")) || {};
  const savedNotes = localStorage.getItem("msmeNotes") || "";

  periods.forEach((period, rowIdx) => {
    const row = document.createElement("tr");
    row.dataset.index = rowIdx;

    let html = `<td>${period}</td>`;
    for (let i = 0; i < 3; i++) {
      const val = savedData?.[rowIdx]?.[i] ?? 0;
      html += `<td><input type="number" min="0" value="${val}" oninput="handleInput(${rowIdx}, ${i}, this.value)"></td>`;
    }
    html += `<td class="bold" id="total${rowIdx}">0</td>`;
    row.innerHTML = html;
    tableBody.appendChild(row);
  });

  document.getElementById("notes").value = savedNotes;
  calculateAll();
}

// Save input
function saveData(row, col, value) {
  let data = JSON.parse(localStorage.getItem("msmeData")) || {};
  if (!data[row]) data[row] = [0, 0, 0];
  data[row][col] = Number(value);
  localStorage.setItem("msmeData", JSON.stringify(data));
}

// Handle input
function handleInput(row, col, value) {
  saveData(row, col, value);
  calculateAll();
}

// Save notes
document.getElementById("notes").addEventListener("input", () => {
  localStorage.setItem("msmeNotes", document.getElementById("notes").value);
});

// Calculate totals
function calculateAll() {
  let microSum = 0, smallSum = 0, mediumSum = 0;

  const rows = document.querySelectorAll("tbody tr");
  rows.forEach((row, rowIdx) => {
    const inputs = row.querySelectorAll("input");
    let rowTotal = 0;

    inputs.forEach((input, idx) => {
      const value = parseFloat(input.value) || 0;
      rowTotal += value;
      if (idx === 0) microSum += value;
      if (idx === 1) smallSum += value;
      if (idx === 2) mediumSum += value;
    });

    document.getElementById(`total${rowIdx}`).innerText = rowTotal;
  });

  document.getElementById("totalMicro").innerText = microSum;
  document.getElementById("totalSmall").innerText = smallSum;
  document.getElementById("totalMedium").innerText = mediumSum;
  document.getElementById("totalOverall").innerText = microSum + smallSum + mediumSum;
}

// Reset all data
function resetData() {
  if (confirm("Are you sure you want to clear all saved data?")) {
    localStorage.removeItem("msmeData");
    localStorage.removeItem("msmeNotes");
    location.reload(); // reload page to clear inputs
  }
}

// Load on page ready
loadData();
</script>

</body>
</html>
